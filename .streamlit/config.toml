# Réglages Streamlit de l'app (pris en compte automatiquement au lancement).

[browser]
# L'app tourne en local avec des données personnelles : pas de statistiques
# d'utilisation envoyées à Streamlit.
gatherUsageStats = false

[server]
# Écoute uniquement sur ce PC : sans ce réglage, Streamlit accepte aussi les
# connexions venant du réseau (Wi-Fi de l'école, d'un café...), et n'importe
# qui sur le même réseau pourrait ouvrir l'app, voir ton CV et utiliser ta clé
# d'IA. Le navigateur s'ouvre sur http://127.0.0.1:8501 (ou localhost:8501).
address = "127.0.0.1"
# Sert le dossier static/ (polices de l'interface, logo) à l'app elle-même.
enableStaticServing = true

[client]
# Masque les options de développeur (bouton « Deploy »...) mais garde le menu
# ⋮ > Settings, qui permet de passer en thème clair ou sombre.
toolbarMode = "viewer"

# ---------------------------------------------------------------------------
# Thème « papier et encre » : une seule couleur d'action (le bleu encre), des
# filets fins, Spectral pour les titres et Instrument Sans pour le reste.
# Les deux polices sont fournies avec l'app (static/polices, licence OFL) :
# rien n'est chargé depuis Internet.
# ---------------------------------------------------------------------------

[theme]
font = "Instrument Sans, sans-serif"
headingFont = "Spectral, Georgia, serif"
# Les blocs « à copier » (e-mail, texte de la lettre) gardent leur bouton de
# copie mais s'affichent dans la police de l'interface, pas en police de code.
codeFont = "Instrument Sans, sans-serif"
codeFontSize = "0.92rem"
baseFontSize = 15
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
linkUnderline = false
headingFontSizes = ["2.45rem", "1.6rem", "1.28rem", "1.08rem", "0.98rem", "0.9rem"]
headingFontWeights = [500, 500, 600, 600, 600, 600]
chartCategoricalColors = ["#4F5FE0", "#8B63DA", "#2F9E6A", "#D08A2E", "#D3554C", "#8A90A0"]

[theme.light]
primaryColor = "#3346D3"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F9"
textColor = "#1B2030"
linkColor = "#3346D3"
borderColor = "#E3E6EE"
codeBackgroundColor = "#F3F5F9"
blueColor = "#3346D3"
blueBackgroundColor = "#EBEEFC"
blueTextColor = "#2A3AB8"

[theme.dark]
# Encre un peu plus soutenue que les liens : le texte blanc des boutons
# principaux reste bien lisible.
primaryColor = "#5B6CF0"
backgroundColor = "#101525"
secondaryBackgroundColor = "#1A2034"
textColor = "#E6E9F2"
linkColor = "#9AA8FF"
borderColor = "#262E45"
codeBackgroundColor = "#171D30"
blueColor = "#8E9CFF"
blueBackgroundColor = "#1E2650"
blueTextColor = "#B9C2FF"

# Polices de l'interface (servies depuis static/polices).
