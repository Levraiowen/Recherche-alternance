[project]
name = "generateur-candidatures-alternance"
version = "2026.11.23"
description = "App Streamlit qui génère une lettre de motivation et un CV adapté (PDF sur une page) à partir d'une offre d'alternance."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = [
    "ai_client", "assistant", "candidature", "cv_editor", "ia_anthropic", "ia_commun", "ia_gemini",
    "import_offre", "interface", "lettre_generator", "mise_en_page", "pdf_export", "rapport", "stockage", "suivi",
    "version",
    "conftest", "test_app",
]
